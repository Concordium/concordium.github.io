<?xml version="1.0" encoding="UTF-8"?>
<svg font-family="IBM Plex Sans, Segoe UI, system-ui, sans-serif" width="1700" height="1400" viewBox="0 0 1700 1400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="UML sequence diagram of agent registration across XDC AI frontend, backend, the embedded wallet, the Concordium Wallet, the Concordium chain and the agent card host">
<rect width="100%" height="100%" fill="#ffffff"></rect>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#10212a"></path></marker>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5d7079"></path></marker>
</defs>

<text x="50" y="48" style="font-family:'Space Grotesk','Segoe UI',system-ui,sans-serif; font-size:30px; font-weight:700; fill:#10212a;">Registration — one time, per agent</text>
<text x="50" y="76" style="font-size:15px; fill:#5d7079;">The Safe is never called. Nothing about the XDC wallet is written to Concordium.</text>

<rect x="1320" y="28" width="330" height="54" rx="10" fill="#f0f6f4" stroke="#bcd8d0"></rect>
<text x="1340" y="50" style="font-size:13px; font-weight:600; fill:#12715c;">User pays no CCD at any point</text>
<text x="1340" y="70" style="font-size:12px; fill:#4e6b62;">Account creation is free · the rest is sponsored</text>

<g style="font-size:13px; font-weight:600;">
<rect x="25" y="108" width="150" height="52" rx="8" fill="#10212a"></rect><text x="100" y="140" text-anchor="middle" fill="#ffffff">User</text>
<rect x="255" y="108" width="150" height="52" rx="8" fill="#0e6c88"></rect><text x="330" y="133" text-anchor="middle" fill="#ffffff">Frontend</text><text x="330" y="150" text-anchor="middle" fill="#cfe6ee" style="font-size:11px;font-weight:400;">XDC AI</text>
<rect x="515" y="108" width="150" height="52" rx="8" fill="#0e6c88"></rect><text x="590" y="133" text-anchor="middle" fill="#ffffff">Backend</text><text x="590" y="150" text-anchor="middle" fill="#cfe6ee" style="font-size:11px;font-weight:400;">+ sponsor service</text>
<rect x="765" y="108" width="150" height="52" rx="8" fill="#3c5763"></rect><text x="840" y="133" text-anchor="middle" fill="#ffffff">Embedded</text><text x="840" y="150" text-anchor="middle" fill="#d3dde2" style="font-size:11px;font-weight:400;">wallet, secp256k1</text>
<rect x="1005" y="108" width="150" height="52" rx="8" fill="#12715c"></rect><text x="1080" y="133" text-anchor="middle" fill="#ffffff">Wallet</text><text x="1080" y="150" text-anchor="middle" fill="#cfe3dc" style="font-size:11px;font-weight:400;">Concordium wallet</text>
<rect x="1265" y="108" width="150" height="52" rx="8" fill="#12715c"></rect><text x="1340" y="133" text-anchor="middle" fill="#ffffff">Concordium</text><text x="1340" y="150" text-anchor="middle" fill="#cfe3dc" style="font-size:11px;font-weight:400;">CIS-8 · CIS-8004</text>
<rect x="1525" y="108" width="150" height="52" rx="8" fill="#3c5763"></rect><text x="1600" y="133" text-anchor="middle" fill="#ffffff">Card host</text><text x="1600" y="150" text-anchor="middle" fill="#d3dde2" style="font-size:11px;font-weight:400;">agent_uri</text>
</g>

<g stroke="#c6d2d8" stroke-width="1.5" stroke-dasharray="5 5">
<line x1="100" y1="165" x2="100" y2="1130"></line>
<line x1="330" y1="165" x2="330" y2="1130"></line>
<line x1="590" y1="165" x2="590" y2="1130"></line>
<line x1="840" y1="165" x2="840" y2="1130"></line>
<line x1="1080" y1="165" x2="1080" y2="1130"></line>
<line x1="1340" y1="165" x2="1340" y2="1130"></line>
<line x1="1600" y1="165" x2="1600" y2="1130"></line>
</g>

<rect x="14" y="185" width="1672" height="345" rx="10" fill="#f0f6f4"></rect>
<rect x="14" y="540" width="1672" height="180" rx="10" fill="#eef4f7"></rect>
<rect x="14" y="730" width="1672" height="385" rx="10" fill="#f7f4ee"></rect>
<g style="font-family:'Space Grotesk','Segoe UI',system-ui,sans-serif; font-size:13px; font-weight:700;">
<text x="26" y="204" fill="#12715c">A · IDENTITY AND ACCOUNT — the user does all of this in their Concordium wallet</text>
<text x="26" y="559" fill="#0e6c88">B · BIND THE KEY — secp256k1, signed in the browser · the user approves this one</text>
<text x="26" y="749" fill="#8a5a12">C · THREE SPONSORED TRANSACTIONS — backend sponsors, the WALLET signs as sender and submits</text>
</g>

<g style="font-size:12.5px; fill:#10212a;" stroke="#10212a" stroke-width="1.6">
<line x1="100" y1="232" x2="326" y2="232" marker-end="url(#ar)"></line><text x="106" y="226" stroke="none">1 · clicks “Get verified”</text>
<line x1="330" y1="272" x2="586" y2="272" marker-end="url(#ar)"></line><text x="336" y="266" stroke="none">2 · start verification</text>
<line x1="590" y1="312" x2="334" y2="312" marker-end="url(#ar)" stroke="#5d7079"></line><text x="336" y="306" stroke="none" fill="#5d7079">3 · WalletConnect URI</text>
<line x1="330" y1="352" x2="104" y2="352" marker-end="url(#ar)" stroke="#5d7079"></line><text x="106" y="346" stroke="none" fill="#5d7079">4 · shows QR code</text>
<line x1="100" y1="392" x2="1076" y2="392" marker-end="url(#ar)"></line><text x="106" y="386" stroke="none">5 · connects their Concordium wallet</text>
<line x1="1080" y1="432" x2="594" y2="432" marker-end="url(#ar)" stroke="#5d7079"></line><text x="600" y="426" stroke="none" fill="#5d7079">6 · WalletConnect session established</text>
<path d="M 1080 460 h 44 v 22 h -40" fill="none" marker-end="url(#ar)"></path><text x="1134" y="472" stroke="none" style="font-weight:600;" fill="#12715c">7 · verifies identity and creates the account — all in the wallet</text>
<line x1="1080" y1="512" x2="594" y2="512" marker-end="url(#ar)" stroke="#5d7079"></line><text x="600" y="506" stroke="none" fill="#12715c" style="font-weight:600;">8 · account address — free, no sender, no fee</text>
</g>

<g style="font-size:12.5px; fill:#10212a;" stroke="#10212a" stroke-width="1.6">
<path d="M 590 558 h 44 v 22 h -40" fill="none" marker-end="url(#ar)"></path><text x="644" y="570" stroke="none">9 · build the CIS-8 canonical message</text>
<line x1="590" y1="598" x2="334" y2="598" marker-end="url(#ar)" stroke="#5d7079"></line><text x="336" y="592" stroke="none" fill="#5d7079">10 · canonical bytes</text>
<line x1="330" y1="633" x2="836" y2="633" marker-end="url(#ar)"></line><text x="336" y="627" stroke="none" style="font-weight:600;">11 · signMessage — the user approves, in this tab</text>
<line x1="840" y1="668" x2="334" y2="668" marker-end="url(#ar)" stroke="#5d7079"></line><text x="340" y="662" stroke="none" fill="#5d7079">12 · signature</text>
<line x1="330" y1="703" x2="586" y2="703" marker-end="url(#ar)"></line><text x="336" y="697" stroke="none">13 · forward the signature</text>
</g>

<g style="font-size:12.5px; fill:#10212a;" stroke="#10212a" stroke-width="1.6">
<path d="M 590 753 h 44 v 22 h -40" fill="none" marker-end="url(#ar)"></path><text x="644" y="765" stroke="none">14 · build the transaction, sign as sponsor</text>
<line x1="590" y1="805" x2="1076" y2="805" marker-end="url(#ar)"></line><text x="596" y="799" stroke="none" style="font-weight:600;">15 · sponsored registerExternalKey → CIS-8</text>
<line x1="1080" y1="845" x2="1336" y2="845" marker-end="url(#ar)"></line><text x="1086" y="839" stroke="none" fill="#8a5a12" style="font-weight:600;">16 · user approves · signs as sender · submits</text>
<line x1="590" y1="885" x2="1076" y2="885" marker-end="url(#ar)"></line><text x="596" y="879" stroke="none">17 · … register(external_reference = Cis8(key))</text>
<line x1="1080" y1="925" x2="1336" y2="925" marker-end="url(#ar)"></line><text x="1086" y="919" stroke="none" fill="#8a5a12" style="font-weight:600;">18 · approves again · submits — returns token id</text>
<line x1="590" y1="965" x2="1596" y2="965" marker-end="url(#ar)"></line><text x="596" y="959" stroke="none">19 · publish agent card — badge + xdc-wallet-binding extension</text>
<line x1="590" y1="1005" x2="1076" y2="1005" marker-end="url(#ar)"></line><text x="596" y="999" stroke="none">20 · … setAgentURI(uri, SHA-256(card))</text>
<line x1="1080" y1="1045" x2="1336" y2="1045" marker-end="url(#ar)"></line><text x="1086" y="1039" stroke="none" fill="#8a5a12" style="font-weight:600;">21 · approves a third time · submits</text>
<line x1="590" y1="1085" x2="334" y2="1085" marker-end="url(#ar)" stroke="#5d7079"></line><text x="336" y="1079" stroke="none" fill="#5d7079">22 · verified — badge string returned</text>
</g>

<rect x="900" y="1150" width="786" height="100" rx="10" fill="#fdf8ef" stroke="#e6d5b4"></rect>
<text x="918" y="1176" style="font-size:13px; font-weight:700; fill:#8a5a12;">Three approvals, and they cannot be batched</text>
<text x="918" y="1198" style="font-size:12.5px; fill:#6b5426;">Each transaction has its own nonce, and 17 additionally needs 16 to have finalised — the</text>
<text x="918" y="1217" style="font-size:12.5px; fill:#6b5426;">contract verifies the CIS-8 entry on the way through. Tell the user why the wallet keeps</text>
<text x="918" y="1236" style="font-size:12.5px; fill:#6b5426;">buzzing, and which of the three they are on.</text>

<rect x="14" y="1150" width="870" height="100" rx="10" fill="#f4f7f8" stroke="#d3dde2"></rect>
<text x="32" y="1176" style="font-size:13px; font-weight:700; fill:#10212a;">Four approvals, in two places</text>
<text x="32" y="1198" style="font-size:12.5px; fill:#4a5c65;">One in the browser — step 11, the Safe owner key, where the user consents to</text>
<text x="32" y="1217" style="font-size:12.5px; fill:#4a5c65;">the binding — then three in the wallet. The backend signs only as sponsor.</text>
<text x="32" y="1236" style="font-size:12.5px; fill:#4a5c65;">Send the contract schema with each request, or the user approves opaque bytes.</text>
</svg>
