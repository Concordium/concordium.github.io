<?xml version="1.0" encoding="UTF-8"?>
<svg font-family="IBM Plex Sans, Segoe UI, system-ui, sans-serif" width="1000" height="1400" viewBox="0 0 1000 1400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="UML sequence diagram of a buying agent verifying a Concordium badge against the agent card, the Concordium chain and the XDC chain">
<rect width="100%" height="100%" fill="#ffffff"></rect>
<defs>
<marker id="v-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#10212a"></path></marker>
<marker id="v-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5d7079"></path></marker>
</defs>

<text x="40" y="48" style="font-family:'Space Grotesk','Segoe UI',system-ui,sans-serif; font-size:30px; font-weight:700; fill:#10212a;">Verification — any time, by anyone</text>
<text x="40" y="76" style="font-size:15px; fill:#5d7079;">No coordination, no session, nothing to collect. Four reads.</text>

<g style="font-size:13px; font-weight:600;">
<rect x="20" y="108" width="190" height="52" rx="8" fill="#10212a"></rect><text x="115" y="133" text-anchor="middle" fill="#ffffff">Buying agent</text><text x="115" y="150" text-anchor="middle" fill="#c9d2d6" style="font-size:11px;font-weight:400;">or any verifier</text>
<rect x="300" y="108" width="150" height="52" rx="8" fill="#3c5763"></rect><text x="375" y="140" text-anchor="middle" fill="#ffffff">Card host</text>
<rect x="540" y="108" width="170" height="52" rx="8" fill="#12715c"></rect><text x="625" y="133" text-anchor="middle" fill="#ffffff">Concordium</text><text x="625" y="150" text-anchor="middle" fill="#cfe3dc" style="font-size:11px;font-weight:400;">CIS-8004 · CIS-8</text>
<rect x="800" y="108" width="170" height="52" rx="8" fill="#8a5a12"></rect><text x="885" y="133" text-anchor="middle" fill="#ffffff">XDC</text><text x="885" y="150" text-anchor="middle" fill="#f0e2c6" style="font-size:11px;font-weight:400;">the Safe</text>
</g>

<g stroke="#c6d2d8" stroke-width="1.5" stroke-dasharray="5 5">
<line x1="115" y1="165" x2="115" y2="1130"></line>
<line x1="375" y1="165" x2="375" y2="1130"></line>
<line x1="625" y1="165" x2="625" y2="1130"></line>
<line x1="885" y1="165" x2="885" y2="1130"></line>
</g>

<rect x="14" y="185" width="972" height="300" rx="10" fill="#f0f6f4"></rect>
<rect x="14" y="495" width="972" height="250" rx="10" fill="#f0f6f4"></rect>
<rect x="14" y="755" width="972" height="360" rx="10" fill="#fdf8ef"></rect>
<g style="font-family:'Space Grotesk','Segoe UI',system-ui,sans-serif; font-size:13px; font-weight:700;">
<text x="26" y="204" fill="#12715c">1 · IS THE AGENT REAL AND UNCHANGED?</text>
<text x="26" y="514" fill="#12715c">2 · WHO IS ACCOUNTABLE FOR THE KEY?</text>
<text x="26" y="774" fill="#8a5a12">3 · DOES THAT KEY ACTUALLY SIGN FOR THIS SAFE?</text>
</g>

<g style="font-size:12.5px; fill:#10212a;" stroke="#10212a" stroke-width="1.6">
<line x1="115" y1="232" x2="371" y2="232" marker-end="url(#v-ar)"></line><text x="121" y="226" stroke="none">1 · GET the agent card</text>
<line x1="375" y1="276" x2="119" y2="276" marker-end="url(#v-ar)" stroke="#5d7079"></line><text x="121" y="270" stroke="none" fill="#5d7079">2 · card JSON — both extensions</text>
<line x1="115" y1="320" x2="621" y2="320" marker-end="url(#v-ar)"></line><text x="121" y="314" stroke="none">3 · agentOf(token id)</text>
<line x1="625" y1="364" x2="119" y2="364" marker-end="url(#v-ar)" stroke="#5d7079"></line><text x="121" y="358" stroke="none" fill="#5d7079">4 · owner, status, agent_uri, metadata_hash, external_reference</text>
<path d="M 115 386 h 44 v 22 h -40" fill="none" marker-end="url(#v-ar)"></path><text x="169" y="398" stroke="none" style="font-weight:600;">5 · status is Active, and SHA-256(card) == metadata_hash</text>
<text x="169" y="440" stroke="none" fill="#5d7079" style="font-size:12px;">The card is now proven to be the one committed on-chain —</text>
<text x="169" y="458" stroke="none" fill="#5d7079" style="font-size:12px;">so everything read out of it below is authenticated.</text>
</g>

<g style="font-size:12.5px; fill:#10212a;" stroke="#10212a" stroke-width="1.6">
<line x1="115" y1="546" x2="621" y2="546" marker-end="url(#v-ar)"></line><text x="121" y="540" stroke="none">6 · ownerOfKey(ExternalKeyId) on CIS-8</text>
<line x1="625" y1="590" x2="119" y2="590" marker-end="url(#v-ar)" stroke="#5d7079"></line><text x="121" y="584" stroke="none" fill="#5d7079">7 · Active, owned by account A</text>
<path d="M 115 612 h 44 v 22 h -40" fill="none" marker-end="url(#v-ar)"></path><text x="169" y="624" stroke="none" style="font-weight:600;">8 · same A as the agent owner? — the displacement guard</text>
<path d="M 115 656 h 44 v 22 h -40" fill="none" marker-end="url(#v-ar)"></path><text x="169" y="668" stroke="none" style="font-weight:600;">9 · derive addr(K) from the registered public key</text>
<text x="169" y="706" stroke="none" fill="#5d7079" style="font-size:12px;">Derive it. Never trust an address reported alongside the key.</text>
</g>

<g style="font-size:12.5px; fill:#10212a;" stroke="#10212a" stroke-width="1.6">
<path d="M 115 794 h 44 v 22 h -40" fill="none" marker-end="url(#v-ar)"></path><text x="169" y="806" stroke="none" style="font-weight:600;">10 · read S = wallet.address from the card</text>
<line x1="115" y1="860" x2="881" y2="860" marker-end="url(#v-ar)"></line><text x="121" y="854" stroke="none">11 · getOwners() on S  ·  0xa0e67e2b</text>
<line x1="885" y1="904" x2="119" y2="904" marker-end="url(#v-ar)" stroke="#5d7079"></line><text x="121" y="898" stroke="none" fill="#12715c" style="font-weight:600;">12 · owner list contains addr(K)  ✓  this is the whole point</text>
<line x1="115" y1="948" x2="881" y2="948" marker-end="url(#v-ar)"></line><text x="121" y="942" stroke="none">13 · getThreshold() on S  ·  0xe75235b8</text>
<line x1="885" y1="992" x2="119" y2="992" marker-end="url(#v-ar)" stroke="#5d7079"></line><text x="121" y="986" stroke="none" fill="#5d7079">14 · T of N — compare with the card’s claim</text>
<path d="M 115 1014 h 44 v 22 h -40" fill="none" marker-end="url(#v-ar)"></path><text x="169" y="1026" stroke="none" style="font-weight:600;">15 · serve the request, or refuse</text>
<text x="169" y="1064" stroke="none" fill="#6b5426" style="font-size:12px;">Owners change with no event on Concordium, so steps 11–14</text>
<text x="169" y="1082" stroke="none" fill="#6b5426" style="font-size:12px;">are run live before anything material — never cached.</text>
</g>

<rect x="14" y="1145" width="972" height="106" rx="10" fill="#f4f7f8" stroke="#d3dde2"></rect>
<text x="34" y="1172" style="font-size:14px; font-weight:700; fill:#10212a;">The rule that keeps a stale card safe</text>
<text x="34" y="1196" style="font-size:13px; fill:#4a5c65;">Card values are the <tspan style="font-weight:600;">expected</tspan> value. The chain read is the <tspan style="font-weight:600;">actual</tspan> value. Mismatch fails.</text>
<text x="34" y="1218" style="font-size:13px; fill:#4a5c65;">The hash proves the card was not tampered with — not that it is current. If the Safe goes 1-of-1 to 2-of-3</text>
<text x="34" y="1238" style="font-size:13px; fill:#4a5c65;">and nobody republishes, the card still says 1-of-1 and its hash still checks out. Only a live read catches it.</text>

<rect x="14" y="1271" width="972" height="112" rx="10" fill="#fdf1f1" stroke="#e8c4c4"></rect>
<text x="34" y="1298" style="font-size:14px; font-weight:700; fill:#8a2020;">What a failure at each stage means</text>
<text x="34" y="1322" style="font-size:13px; fill:#6d3434;"><tspan style="font-weight:600;">Step 5</tspan> — the card was swapped, or it was edited without re-anchoring.</text>
<text x="34" y="1344" style="font-size:13px; fill:#6d3434;"><tspan style="font-weight:600;">Step 7 or 8</tspan> — the registration was revoked, or displaced to a different Concordium account.</text>
<text x="34" y="1366" style="font-size:13px; fill:#6d3434;"><tspan style="font-weight:600;">Step 12</tspan> — the key was rotated out of the Safe. Everything on Concordium still looks perfectly fine.</text>
</svg>
